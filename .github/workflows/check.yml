name: check
on: [push, pull_request]
jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivial check
        run: |
          echo "Checking bounties.json is valid JSON..."
          node -e "JSON.parse(require('fs').readFileSync('bounties.json','utf8'))"
          echo "✓ ok"
